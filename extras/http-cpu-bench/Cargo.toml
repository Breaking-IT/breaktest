[package]
name = "http-cpu-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust HTTP stub and baseline load generator for BreakTest CPU-per-request benchmarks"

[[bin]]
name = "bench-stub"
path = "src/stub.rs"

[[bin]]
name = "bench-loadgen"
path = "src/loadgen.rs"

[dependencies]
bytes = "1"
flate2 = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[profile.release]
codegen-units = 1
lto = "thin"
