name: CI

# Run validation in BreakTest and contributor forks without requiring secrets.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# https://help.github.com/en/actions/automating-your-workflow-with-github-actions/software-installed-on-github-hosted-runners

concurrency:
  # Preserve each main push; cancel superseded runs of the same PR.
  # More info: https://stackoverflow.com/a/68422069/253468
  group: ${{ github.event_name == 'push' && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  matrix_prep:
    name: Matrix Preparation
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    env:
      # Random Windows/macOS jobs; matrix.mjs also adds one fixed Linux job.
      MATRIX_JOBS: 5
    steps:
      - uses: actions/checkout@v6
      - id: set-matrix
        run: |
          npm ci --prefix .github/workflows
          node .github/workflows/matrix.mjs

  test:
    needs: matrix_prep
    name: '${{ matrix.name }}'
    runs-on: ${{ matrix.os }}
    env:
      TZ: ${{ matrix.tz }}
      BREAKTEST_HTTP3_LIVE: ${{ matrix.java_version == '26' && 'true' || 'false' }}
    strategy:
      matrix: ${{fromJson(needs.matrix_prep.outputs.matrix)}}
      fail-fast: false
      # max-parallel: 4
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 50
    - name: Set up Java ${{ matrix.java_version }}, oracle
      if: ${{ matrix.oracle_java_website != '' }}
      uses: oracle-actions/setup-java@fff43251af9936a0e6a4d5d0946e14f1680e9b6b # v1.5.0
      with:
        website: ${{ matrix.oracle_java_website }}
        release: ${{ matrix.java_version }}
    - name: Set up Java 21 and ${{ matrix.non_ea_java_version }}, ${{ matrix.java_distribution }}
      uses: actions/setup-java@v5
      with:
        # The latest one will be the default, so we use Java 21 for launching Gradle
        java-version: |
          ${{ matrix.non_ea_java_version }}
          21
        # Use the runner architecture (native ARM64 on macOS).
        distribution: ${{ matrix.java_distribution }}
    - name: Start virtual display for Linux GUI tests
      if: runner.os == 'Linux'
      shell: bash
      run: |
        Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
        xvfb_pid=$!
        for attempt in {1..40}; do
          if DISPLAY=:99 xdpyinfo > /dev/null 2>&1; then
            echo 'DISPLAY=:99' >> "$GITHUB_ENV"
            exit 0
          fi
          if ! kill -0 "$xvfb_pid" 2>/dev/null; then
            break
          fi
          sleep 0.25
        done
        cat "$RUNNER_TEMP/xvfb.log"
        exit 1
    - name: Steps to reproduce
      uses: actions/github-script@v8
      with:
        script: |
          console.log('The following command might help reproducing CI results, use Java ${{ matrix.java_version }}')
          console.log('TZ="${{ matrix.tz }}" _JAVA_OPTIONS="${{ matrix.extraJvmArgs }}" ./gradlew --continue build -x distTar -x distTarSource -x distTarSha512 -x distTarSourceSha512 ${{ matrix.extraGradleArgs }} -PtestExtraJvmArgs="${{ matrix.testExtraJvmArgs }}" -PtestDisableCaching="${{ matrix.testDisableCaching }}"')
    - uses: burrunan/gradle-cache-action@v3
      name: Test
      with:
        job-id: jdk${{ matrix.java_version }}
        multi-cache-enabled: false
        # An explicit skip for Sha512 tasks is required due to https://github.com/gradle/gradle/issues/16789
        arguments: --scan --no-parallel --continue build -x distTar -x distTarSource -x distTarSha512 -x distTarSourceSha512 ${{ matrix.extraGradleArgs }}
        properties: |
          testExtraJvmArgs=${{ matrix.testExtraJvmArgs }}
          testDisableCaching=${{ matrix.testDisableCaching }}
          jdkBuildVersion=21
          jdkTestVersion=${{ matrix.java_version }}
          jdkTestVendor=${{ matrix.java_vendor }}
          # We have a separate job with Errorprone verifications, so avoid duplicate warnings
          enableErrorprone=false
          # We provision JDKs with GitHub Actions for caching purposes, so Gradle should rather fail in case JDK is not found
          org.gradle.java.installations.auto-download=false
      env:
        _JAVA_OPTIONS: ${{ matrix.extraJvmArgs }}
        DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

  errorprone:
    name: 'Error Prone (JDK 21)'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: 'Set up JDK 21'
      uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: 'zulu'
    - uses: burrunan/gradle-cache-action@v3
      name: Test
      with:
        job-id: errprone
        multi-cache-enabled: false
        arguments: --scan --no-parallel --no-daemon classes
      env:
        DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
