name: Sampler TLS

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs of the same PR; keep every main push.
  group: ${{ github.event_name == 'push' && format('sampler-tls-{0}', github.sha) || format('sampler-tls-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  sampler-tls:
    if: github.repository == 'Breaking-IT/breaktest'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [21, 27]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            ${{ matrix.java }}
            21
      - name: Set up Gradle caching
        # Reuse dependencies and task outputs; main writes the cache, PRs read it.
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Create HTTP/3 TLS fixtures
        if: matrix.java >= 27
        run: |
          bash src/protocol/http/src/test/resources/http3/create-fixture.sh "$RUNNER_TEMP/http3"
          docker run --rm -d --name breaktest-h3-review \
            -p 127.0.0.1:19443-19446:19443-19446/tcp \
            -p 127.0.0.1:19443-19446:19443-19446/udp \
            -v "$RUNNER_TEMP/http3:/fixture:ro" \
            caddy:2@sha256:13ba145cba2f3e28fa801994876e4c086d1b95d5aa2a520a734765ffb6b12017 \
            caddy run --config /fixture/Caddyfile
          # Docker can accept TCP before Caddy completes TLS startup, yielding
          # curl error 35 rather than connection refused. Bound retries for both.
          curl -kf --retry 10 --retry-all-errors --retry-delay 1 \
            --connect-timeout 2 --max-time 5 --retry-max-time 30 https://localhost:19443/
          echo "BREAKTEST_HTTP3_FIXTURE=$RUNNER_TEMP/http3" >> "$GITHUB_ENV"
          echo 'BREAKTEST_HTTP3_SELF_SIGNED_URL=https://localhost:19443/' >> "$GITHUB_ENV"
      - name: Sampler and updater TLS tests
        run: |
          ./gradlew :src:protocol:http:test --tests '*TestHTTPJavaHttp3Impl' --tests '*TestHTTPHC5Impl' \
            :src:core:test --tests '*UpdateService*Test' \
            -PjdkTestVersion=${{ matrix.java }} \
            -Djmeter.properties.jdk.internal.httpclient.disableHostnameVerification=true
      - name: HTTP/3 mutual TLS without certificate retries
        if: matrix.java >= 27
        run: |
          ./gradlew :src:protocol:http:test --tests '*HTTP3MutualTlsTest' \
            -PjdkTestVersion=${{ matrix.java }} -Djmeter.properties.jdk.internal.httpclient.disableHostnameVerification=true \
            -Djmeter.properties.jdk.net.hosts.file="$BREAKTEST_HTTP3_FIXTURE/hosts"
      - name: HTTP/3 scoped client certificates
        if: matrix.java >= 27
        run: |
          # Each mode gets a fresh JVM: HTTP/3 certificate policy is initialized once.
          for retry in false true; do
            ./gradlew :src:protocol:http:test --tests '*HTTP3ScopedClientCertificateTest' \
              -PjdkTestVersion=${{ matrix.java }} -Djmeter.properties.jdk.internal.httpclient.disableHostnameVerification=true \
              -Djmeter.properties.jdk.net.hosts.file="$BREAKTEST_HTTP3_FIXTURE/hosts" \
              -Djmeter.properties.httpsampler.http3.ignore_certificate_errors="$retry"
          done
      - uses: actions/setup-go@v6
        if: matrix.java >= 27
        with:
          go-version-file: src/protocol/http/src/test/resources/http3/resumption/go.mod
          cache-dependency-path: src/protocol/http/src/test/resources/http3/resumption/go.sum
      - name: HTTP/2 and HTTP/3 TLS session resumption and user isolation
        if: matrix.java >= 27
        run: |
          (cd src/protocol/http/src/test/resources/http3/resumption && go build -o "$RUNNER_TEMP/h3-resumption-server" .)
          BREAKTEST_HTTP3_RESUMPTION_SERVER="$RUNNER_TEMP/h3-resumption-server" \
            ./gradlew :src:protocol:http:test --tests '*HTTP2SessionResumptionTest' \
              -PjdkTestVersion=${{ matrix.java }}
          BREAKTEST_HTTP3_RESUMPTION_SERVER="$RUNNER_TEMP/h3-resumption-server" \
            ./gradlew :src:protocol:http:test --tests '*HTTP3SessionResumptionTest' \
              -PjdkTestVersion=${{ matrix.java }}
      - name: HTTP/2 cross-origin connection coalescing
        if: matrix.java >= 27
        run: |
          BREAKTEST_HTTP3_RESUMPTION_SERVER="$RUNNER_TEMP/h3-resumption-server" \
            ./gradlew :src:protocol:http:test --tests '*HTTP2CoalescingTest' \
              -PjdkTestVersion=${{ matrix.java }}
      - name: Default HTTPS protocol discovery
        if: matrix.java >= 27
        run: |
          BREAKTEST_HTTP3_RESUMPTION_SERVER="$RUNNER_TEMP/h3-resumption-server" \
            ./gradlew :src:protocol:http:test --tests '*HTTPDefaultProtocolUpgradeTest' \
              -PjdkTestVersion=${{ matrix.java }}
      - name: Embedded startup configuration regression
        if: matrix.java >= 27
        run: |
          ./gradlew :src:protocol:http:test \
            --tests '*TestHTTPJavaHttp3Impl.embeddedClientWithoutStartupSettingRejectsWrongHostname' \
            -PjdkTestVersion=${{ matrix.java }} -Djmeter.properties.jdk.internal.httpclient.disableHostnameVerification=false
      - name: Container diagnostics and cleanup
        if: always() && matrix.java >= 27
        run: |
          docker logs breaktest-h3-review || true
          docker stop breaktest-h3-review || true
