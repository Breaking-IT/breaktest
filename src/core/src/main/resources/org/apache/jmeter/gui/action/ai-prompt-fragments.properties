taskScope.fullRepair=Repair and harden the selected Thread Group in the repair target file.

taskScope.specificRequest=Complete only the specific user-requested task against the repair target file.

assertions.enabled=- Assertion phase is enabled. Add meaningful response assertions only after the selected flow is green and high-confidence dynamic leftovers are resolved or documented.

assertions.disabled=- Assertion phase is disabled by the start dialog. Skip adding or updating Response Assertions unless the user explicitly asks for assertions in the extra instructions. Keep failOnNoMatch=true for required extractors because that is correlation failure detection, not a transaction assertion.
