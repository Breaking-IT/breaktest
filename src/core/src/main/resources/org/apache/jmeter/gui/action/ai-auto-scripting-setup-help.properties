text=AI Auto Scripting (Beta)\n\
\n\
What it does\n\
AI Auto Scripting starts a local coding-agent CLI from BreakTest and gives it a built-in repair prompt. The agent uses the BreakTest agent bridge to inspect the open plan, read validation evidence, use the linked recording when available, apply supported edits, and report progress back into the AI log.\n\
\n\
Local agent permissions\n\
The run uses broad local-agent permissions because the selected tool may edit JMX files, call the BreakTest bridge, validate the plan, and read local evidence files. BreakTest creates a backup before the run starts, and the Start button stays disabled until you approve the dangerous local-agent settings in the dialog.\n\
\n\
MCP and bridge setup\n\
BreakTest starts its local agent bridge when the agent is enabled. The AI Auto Scripting launcher calls the bridge through the bundled command-line helper, so Codex, Claude Code, Cursor Agent, Gemini CLI, Pi Code, OpenCode, and Copilot CLI can interact with the currently open BreakTest GUI without you starting another server manually.\n\
\n\
For manual Codex sessions that should talk to BreakTest directly, add this MCP server to the Codex config and restart Codex:\n\
\n\
[mcp_servers.breaktest]\n\
command = "<BREAKTEST_HOME>/bin/breaktest-agent-mcp"\n\
\n\
Replace <BREAKTEST_HOME> with the folder that contains your BreakTest bin directory.\n\
\n\
Tool selection\n\
The tool selector checks each configured CLI executable when the dialog opens. Available tools are listed first in alphabetical order, followed by unavailable tools in alphabetical order. A missing executable is shown as `(unavailable)` but remains selectable so you can inspect setup help or configure its command path.\n\
Codex uses `codex exec` and the Codex CLI defaults unless BreakTest properties override them.\n\
Claude Code uses Claude Code print mode and the Claude Code defaults unless BreakTest properties override them.\n\
Cursor Agent uses print mode with edits and commands forced for the run. Its process sandbox is disabled by default because the BreakTest GUI bridge uses a host-local socket. Run `cursor-agent login` once to store authentication in Cursor itself; BreakTest never stores or passes a Cursor API key.\n\
Gemini CLI uses headless text mode with workspace trust and tool calls approved for the run. Its process sandbox is disabled by default because the BreakTest GUI bridge uses a host-local socket. Model selection comes from Gemini CLI unless breaktest.gemini.model explicitly overrides it. Run `gemini` once and select `Use Gemini API key` to save authentication in Gemini itself; BreakTest never stores or passes the key. If your Gemini version cannot store it securely, put `GEMINI_API_KEY=...` in `~/.gemini/.env` and restrict that file to your user.\n\
Pi Code uses `pi --print` with project resources approved for the run and the provider/model/thinking settings configured on your machine unless BreakTest properties override them. Runs are ephemeral and do not add to Pi's session history.\n\
OpenCode uses `opencode run` and the OpenCode provider/model/agent configured on your machine unless BreakTest properties override them.\n\
Copilot CLI uses `copilot -p` non-interactive mode and the model configured in your Copilot CLI settings unless BreakTest properties override them. It needs an active GitHub Copilot subscription and a signed-in Copilot CLI. Copilot only reports its model and token usage in its stats output, so BreakTest does not suppress it; set breaktest.copilot.model if you want a specific model recorded up front.\n\
\n\
Recommended harnesses\n\
Codex and Claude Code are currently the preferred harnesses for AI Auto Scripting. They have been the most reliable choices for long repair loops, structured tool use, and following the BreakTest scripting rules.\n\
\n\
Cursor Agent, Gemini CLI, Pi Code, OpenCode, and Copilot CLI support is available for experimentation. Pi Code and OpenCode are useful for local or OpenAI-compatible models; Cursor Agent and Gemini CLI use their respective hosted model catalogs. These harnesses are not yet proven to work as well as Codex or Claude Code for full AI Repair runs.\n\
\n\
BreakTest does not choose a separate fast/standard variant. Model, thinking, speed, and provider behavior come from the selected CLI tool defaults or from that tool's own config. Use the CLI's normal configuration if you want a different model, reasoning level, provider, or local LM Studio model.\n\
\n\
Useful BreakTest properties\n\
breaktest.ai.tool                 Default tool: codex, claude, cursor, gemini, pi, opencode, or copilot\n\
breaktest.ai.edit_surface         Default edit surface: gui or non-gui\n\
breaktest.agent.tool              Path to the BreakTest agent bridge helper\n\
\n\
breaktest.codex.command           Codex executable, default `codex`\n\
breaktest.codex.model             Optional Codex model override\n\
breaktest.codex.cwd               Optional Codex working directory\n\
breaktest.codex.sandbox           Codex sandbox setting used by the launcher\n\
breaktest.codex.approval          Codex approval setting used by the launcher\n\
\n\
breaktest.claude.command          Claude Code executable, default `claude`\n\
breaktest.claude.model            Optional Claude model override\n\
breaktest.claude.max_turns        Optional Claude max-turns limit\n\
breaktest.claude.cwd              Optional Claude working directory\n\
\n\
breaktest.cursor.command         Cursor Agent executable, default `cursor-agent`\n\
breaktest.cursor.model           Optional Cursor model override\n\
breaktest.cursor.force           Allow autonomous edits and commands, default `true`\n\
breaktest.cursor.sandbox         Cursor sandbox mode, default `disabled`\n\
breaktest.cursor.cwd             Optional Cursor working directory\n\
\n\
breaktest.gemini.command          Gemini CLI executable, default `gemini`\n\
breaktest.gemini.model            Optional Gemini model override\n\
breaktest.gemini.approval         Gemini approval mode, default `yolo`\n\
breaktest.gemini.sandbox          Gemini process sandbox, default `false`\n\
breaktest.gemini.cwd              Optional Gemini working directory\n\
\n\
breaktest.pi.command              Pi executable, default `pi`\n\
breaktest.pi.provider             Optional Pi provider override\n\
breaktest.pi.model                Optional Pi model override\n\
breaktest.pi.thinking             Optional Pi thinking-level override\n\
breaktest.pi.cwd                  Optional Pi working directory\n\
\n\
breaktest.opencode.command        OpenCode executable, default `opencode`\n\
breaktest.opencode.model          Optional OpenCode model override\n\
breaktest.opencode.agent          Optional OpenCode agent override\n\
breaktest.opencode.cwd            Optional OpenCode working directory\n\
\n\
breaktest.copilot.command         Copilot CLI executable, default `copilot`\n\
breaktest.copilot.model           Optional Copilot model override\n\
breaktest.copilot.agent           Optional Copilot custom agent override\n\
breaktest.copilot.cwd             Optional Copilot working directory\n\
\n\
Edit surfaces\n\
GUI mode edits the currently open plan through GUI-backed BreakTest bridge tools, so changes can be tracked in the AI log and changes table.\n\
\n\
JMX file mode saves the current GUI state, creates an immutable backup, and lets the agent edit the active saved JMX. When it finishes, BreakTest reloads the active file; the backup is left unchanged.\n\
\n\
During a run\n\
Progress appears in the AI Auto Scripting log pane or window. The Stop button stops the running local AI process. Maximum runtime and similar retry limit are sent to the agent so long-running or repetitive repair loops can be bounded.
