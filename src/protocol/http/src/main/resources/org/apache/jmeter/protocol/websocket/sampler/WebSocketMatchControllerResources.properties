displayName=WebSocket Match
match.displayName=Incoming application message
matchMode.displayName=Match using
matchMode.shortDescription=Text and regex apply to text messages; a hex sequence matches anywhere in a binary message.
matchValue.displayName=Matching value (text, regex, or hex)
matchValue.shortDescription=Exact text, a Java regular expression (find), or hexadecimal bytes with optional whitespace.
variablePrefix.displayName=Message variable prefix
variablePrefix.shortDescription=Handler-local variables: prefix_message, prefix_hex, prefix_session, prefix_binary, and regex groups prefix_g0, prefix_g1, etc.
captureVariable.displayName=First regex group variable (optional)
captureVariable.shortDescription=Expose the first regex capture as this handler-local variable, for example pageDone.
